<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          const originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          let currentFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get() {
                return currentFetch;
              },
              set(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (err) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get() {
                  return currentFetch;
                },
                set(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true,
              });
            }
          }
        } catch (e) {
          // Ignore
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE SPIRIT'S LABYRINTH • Hostel 1998</title>
    <meta name="description" content="A Burmese folk-horror investigation game set in a 1998 university hostel." />
